[package]
name = "radiator-routes"
version = "1.0.0"
description = "Radiator Routes cross-platform travel planner"
authors = ["Harsh Tambade"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
