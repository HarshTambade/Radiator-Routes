name: Native app releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  npm-sources:
    name: Archive locked npm sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and verify locked npm source archives
        run: npm run sources:npm -- --out release-sources/npm
      - name: Package npm sources
        run: |
          cd release-sources/npm
          zip -qr "$RUNNER_TEMP/Radiator-Routes-npm-sources.zip" .
      - name: Package versioned application source
        run: tar -czf "$RUNNER_TEMP/Radiator-Routes-source.tar.gz" --exclude=.git --exclude=node_modules --exclude=dist --exclude=release-sources .
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-sources
          path: |
            ${{ runner.temp }}/Radiator-Routes-npm-sources.zip
            ${{ runner.temp }}/Radiator-Routes-source.tar.gz
          if-no-files-found: error

  linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libfuse2t64 libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build Linux packages
        run: npm run tauri -- build --bundles deb,appimage
      - name: Archive Tauri Rust dependency sources
        shell: bash
        run: |
          cd src-tauri
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          tar -czf "$RUNNER_TEMP/Radiator-Routes-tauri-rust-sources.tar.gz" Cargo.toml Cargo.lock build.rs src .cargo/config.toml vendor
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-rust-sources
          path: ${{ runner.temp }}/Radiator-Routes-tauri-rust-sources.tar.gz
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build Windows installers
        run: npm run tauri -- build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS desktop
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build unsigned universal macOS disk image
        if: ${{ vars.MACOS_SIGNING_ENABLED != 'true' }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg
      - name: Prepare macOS notarization key
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"
      - name: Build signed and notarized universal macOS disk image
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/notary-key.p8
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - name: Sync Capacitor Android project
        run: npm run cap:android
      - name: Build installable Android debug APK
        run: android/gradlew --project-dir android --write-locks assembleDebug :app:archiveDependencySources
      - name: Archive Android Maven dependency sources and locks
        run: |
          mkdir -p android/app/build/dependency-sources/project-config
          for lock_file in android/gradle.lockfile android/app/gradle.lockfile; do
            if [ -f "$lock_file" ]; then
              cp "$lock_file" android/app/build/dependency-sources/project-config/
            fi
          done
          cp android/variables.gradle android/build.gradle android/app/build.gradle android/gradle/wrapper/gradle-wrapper.properties android/app/build/dependency-sources/project-config/
          cd android/app/build/dependency-sources
          zip -qr "$RUNNER_TEMP/Radiator-Routes-android-maven-sources.zip" .
      - name: Stage Android APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/Radiator-Routes-android-debug.apk
      - name: Build signed Android APK when release signing is configured
        if: ${{ vars.ANDROID_RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/radiator-routes-release.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          android/gradlew --project-dir android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk release-android/Radiator-Routes-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: release-android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-maven-sources
          path: ${{ runner.temp }}/Radiator-Routes-android-maven-sources.zip
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web app and sync Capacitor iOS project
        run: |
          npm run build
          npx cap sync ios
      - name: Resolve and archive Swift package sources
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages"
          mkdir -p "$RUNNER_TEMP/capacitor-swift-sources"
          cp -R "$RUNNER_TEMP/swift-packages/checkouts" "$RUNNER_TEMP/capacitor-swift-sources/checkouts"
          cp ios/App/CapApp-SPM/Package.swift "$RUNNER_TEMP/capacitor-swift-sources/Package.swift"
          find ios/App -name Package.resolved -exec cp {} "$RUNNER_TEMP/capacitor-swift-sources/Package.resolved" \;
          cd "$RUNNER_TEMP"
          zip -qr Radiator-Routes-capacitor-swift-sources.zip capacitor-swift-sources
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages" \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ios-simulator/Build/Products/Release-iphonesimulator/App.app" \
            "$RUNNER_TEMP/Radiator-Routes-ios-simulator.zip"
      - name: Import Apple distribution certificate
        if: ${{ vars.IOS_ADHOC_SIGNING_ENABLED == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install ad hoc provisioning profile
        if: ${{ vars.IOS_ADHOC_SIGNING_ENABLED == 'true' }}
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$RUNNER_TEMP/radiator-routes.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Build signed ad hoc iOS IPA
        if: ${{ vars.IOS_ADHOC_SIGNING_ENABLED == 'true' }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Radiator-Routes.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.radiatorroutes.app</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Radiator-Routes.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-export"
          cp "$RUNNER_TEMP/ios-export/App.ipa" "$RUNNER_TEMP/Radiator-Routes-ios-adhoc.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/Radiator-Routes-ios-simulator.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: capacitor-swift-sources
          path: ${{ runner.temp }}/Radiator-Routes-capacitor-swift-sources.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ vars.IOS_ADHOC_SIGNING_ENABLED == 'true' }}
        with:
          name: ios-adhoc
          path: ${{ runner.temp }}/Radiator-Routes-ios-adhoc.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - npm-sources
      - linux
      - windows
      - macos
      - android
      - ios
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Radiator Routes ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
            release-assets/**/*
