apply plugin: 'com.android.application'

def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace = "com.radiatorroutes.app"
    compileSdk = rootProject.ext.compileSdkVersion
    if (releaseStorePath) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId "com.radiatorroutes.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.register('archiveDependencySources') {
    dependsOn 'assembleDebug'
    doLast {
        def sourceDirectory = file("$buildDir/dependency-sources")
        sourceDirectory.mkdirs()
        def sourceManifest = []
        def externalModules = configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.id }
            .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .unique { "${it.group}:${it.module}:${it.version}" }

        externalModules.each { module ->
            def coordinate = "${module.group}:${module.module}:${module.version}"
            def sourceCoordinate = "${coordinate}:sources@jar"
            try {
                def sourceConfiguration = project.configurations.detachedConfiguration(
                    project.dependencies.create(sourceCoordinate)
                )
                sourceConfiguration.transitive = false
                def sourceJar = sourceConfiguration.singleFile
                def archiveName = "${module.group}-${module.module}-${module.version}-sources.jar".replaceAll('[^A-Za-z0-9._-]', '_')
                copy {
                    from sourceJar
                    into sourceDirectory
                    rename { archiveName }
                }
                sourceManifest << [coordinate: coordinate, sourceArchive: archiveName]
            } catch (Exception error) {
                logger.warn("No published source JAR for ${coordinate}: ${error.message}")
                sourceManifest << [coordinate: coordinate, sourceArchive: null]
            }
        }

        new File(sourceDirectory, 'android-maven-sources.json').text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
                configuration: 'debugRuntimeClasspath resolution result',
                dependencies: sourceManifest.sort { left, right -> left.coordinate <=> right.coordinate },
            ])) + System.lineSeparator()
        new File(sourceDirectory, 'android-maven.lock').text =
            externalModules.collect { "${it.group}:${it.module}:${it.version}" }.sort().join(System.lineSeparator()) + System.lineSeparator()
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
